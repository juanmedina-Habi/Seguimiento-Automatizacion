<script>
/* Abre el tablero y vuelve a pintar cuando cambia un filtro. */
if (window.ES_DEV) {
  const marcaDev = document.getElementById("marca-dev");
  if (marcaDev) marcaDev.hidden = false;
  document.title = "Seguimiento Automatización (dev)";
}
/* ------------------------------------------------------------------ render */
// Sin datos.js (o abriendo la plantilla sola) se pintan los datos de demostración.
const HAY_DATOS = !!(window.CELDAS || window.FILAS_WBR);
let REPORTE = window.CELDAS
  ? armar(filasAgregadas(), CONFIG, window.CORTE_WBR)
  : (window.FILAS_WBR ? armar(window.FILAS_WBR, CONFIG, window.CORTE_WBR) : DEMO);
if (window.CELDAS) REPORTE.pais = resumenFiltro();

function textoActualizado() {
  const iso = window.ACTUALIZADO_EN;
  if (!iso) {
    const [anio, mes, dia] = String(window.CORTE_WBR || REPORTE.corte || "").split("-");
    if (!anio) return "sin fecha";
    return `${+dia} de ${MES_LARGO[+mes - 1]} de ${anio}`;
  }
  const fecha = new Date(iso);
  if (Number.isNaN(fecha.getTime())) return iso;
  const hora = new Intl.DateTimeFormat("es-CO", { hour: "numeric", minute: "2-digit" }).format(fecha);
  return `${fecha.getDate()} de ${MES_LARGO[fecha.getMonth()]} de ${fecha.getFullYear()}, ${hora}`;
}

function render() {
  const corte = REPORTE.corte;
  const vista = vistaActiva();

  const cuerpo = vista.secciones.map(s => {
    const banda = s.nivel === 2
      ? `<h2 class="banda-2">${s.banda ?? ""}</h2>`
      : `<h2 class="banda-1">${s.banda ?? ""}</h2>`;
    return banda + (s.indicadores || []).map(i => indicadorHtml(i, corte)).join("");
  }).join("");

  document.getElementById("pagina").innerHTML = `
    <header class="tapa">
      <!-- Logo oficial, variante positiva. Es copia literal de
           comun/assets/habi-logo.svg y va EN LÍNEA a propósito: enlazado, el
           PDF perdería la marca si el HTML se moviera de carpeta.
           Sus colores van en hexadecimal y esa es la única excepción a la regla
           de no escribir colores literales: el sistema pide usar el archivo tal
           cual y prohíbe reconstruir el logo desde los tokens. -->
      <span class="marca">
        <svg viewBox="0 0 56 56" fill="none" role="img" aria-label="Habi">
          <path d="M50 42.5612V28.8696C50 27.1357 49.3107 25.4758 48.0783 24.2599L32.4334 8.82379C29.9687 6.39207 26.0313 6.39207 23.5666 8.82379L7.92167 24.2599C6.6893 25.4758 6 27.1357 6 28.8696V42.5612C6 46.1137 8.84073 49 12.3603 49H43.6501C47.1593 49 50 46.1242 50 42.5612Z" fill="#7E22CE"/>
          <path d="M25.0986 32.8932C26.1939 32.8932 26.9494 33.264 27.3535 33.8903L27.5127 33.0729H30.2031V40.7477H27.5547L27.4277 39.9196C26.7684 40.6625 25.7471 40.9278 24.8857 40.8854C22.6316 40.7473 21.3662 39.1444 21.3662 36.9049C21.3662 34.6335 22.8656 32.8933 25.0986 32.8932ZM34.7432 33.7204H34.7539C35.1793 33.2111 35.9029 32.8932 36.8916 32.8932C39.135 32.8934 40.624 34.5594 40.624 36.9049C40.624 39.3249 39.3579 40.7474 37.1035 40.8854C36.2423 40.9278 35.2217 40.6623 34.5625 39.9196L34.4346 40.7477H31.8828V29.8678H34.7432V33.7204ZM44.7812 33.1901V40.7477H41.9004V33.1901H44.7812ZM15.1562 33.8903C15.6985 33.19 16.2938 32.8933 17.208 32.8932C18.7605 32.8932 20.2284 33.9011 20.2285 36.4801V40.737H17.3779V36.4909C17.346 35.6207 16.9101 35.3551 16.3359 35.3551C15.7724 35.3553 15.156 35.7801 15.1348 36.6715V40.7262H12.2529V29.8678H15.1562V33.8903ZM36.2314 35.2174C35.2215 35.2176 34.6904 36.056 34.6904 36.9899C34.6904 37.7964 35.264 38.5922 36.2314 38.5924C37.0928 38.5924 37.7734 37.9877 37.7734 36.9157C37.7734 35.8436 37.0928 35.2174 36.2314 35.2174ZM25.7686 35.2067C24.9179 35.2173 24.2266 35.8329 24.2266 36.9049C24.2266 37.9769 24.9073 38.5816 25.7686 38.5817C26.7362 38.5817 27.3535 37.8071 27.3535 36.9049C27.3535 35.8753 26.7788 35.2067 25.7686 35.2067Z" fill="white"/>
          <path d="M43.3883 15.6027C44.5746 15.6027 45.5363 14.6428 45.5363 13.4587C45.5363 12.2745 44.5746 11.3146 43.3883 11.3146C42.2019 11.3146 41.2402 12.2745 41.2402 13.4587C41.2402 14.6428 42.2019 15.6027 43.3883 15.6027Z" fill="#F45201"/>
        </svg>
      </span>
      <h1 class="titulo-area">${vista.titulo}${REPORTE.pais ? `<small>${REPORTE.pais}</small>` : ""}</h1>
      <span class="subrayado"></span>
    </header>
    ${cuerpo}`;

  document.getElementById("detalle-slot").innerHTML = htmlTablaDetalle();
  engancharDetalle();
  pintarDetalle();

  const titulo = document.getElementById("titulo-vista");
  if (titulo) titulo.textContent = vista.titulo;
  const sub = document.getElementById("subtitulo-vista");
  if (sub) sub.textContent = detalleFiltro() || resumenFiltro();
  const act = document.getElementById("actualizacion");
  if (act) act.innerHTML = `<span>Datos del día</span><b>${textoActualizado()}</b>`;
  document.querySelectorAll("#pestanas button").forEach(b => {
    const on = b.dataset.vista === estadoVista;
    b.classList.toggle("activa", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  if (!document.getElementById("revision").hidden) verificar();
}

/* ------------------------------------------------- verificación de uniformidad
   Existe porque cada área construye su versión por separado y todas terminan
   en el mismo PDF de Leonardo. Verifica el MARCO —lo que hace que dos páginas
   de áreas distintas se lean como un solo documento— y deja libre el LIENZO,
   que es lo que pasa dentro del área de trazado.

   Antes verificaba casi lo contrario: comprobaba la paleta a fondo y no medía
   la columna de comentarios, la tipografía ni el logo. La paleta es lo que más
   razones legítimas tiene para variar; el marco es lo que no puede.

   MARCO      falla en rojo. Rompe la consolidación.
   CATÁLOGO   falla en rojo si hay literales; lista los --area-* declarados.
   LIENZO     no se verifica. Es del área. */

const ORDEN_KPI = ["wow", "mtd_actual", "mtd_anterior", "mom",
                   "meta", "cumplimiento", "meta_estacional",
                   "cumplimiento_estacional"];

/* El mismo orden, reconocido por la etiqueta. Hace falta porque un indicador
   puede traer los KPIs ya construidos a mano —sin `clave`— en vez de dejar que
   `armar` los arme desde la periodicidad. Sin este respaldo la comprobación se
   saltaba en silencio, que es peor que no tenerla. */
const ORDEN_ETIQUETA = [
  /^wow/i, /^mtd mes actual/i, /^mtd mes anterior/i, /^mom/i,
  /^meta(?! *estacional)/i, /^cumpl(?!.*estacional)/i,
  /^meta *estacional/i, /^cumpl.*estacional/i,
];
const posicionKpi = k => {
  if (k.clave) { const i = ORDEN_KPI.indexOf(k.clave); if (i >= 0) return i; }
  return ORDEN_ETIQUETA.findIndex(re => re.test((k.etiqueta || "").trim()));
};

const FORMATOS_VALIDOS = ["entero", "miles", "decimal", "decimal_1",
                          "porcentaje", "porcentaje_0", "porcentaje_1",
                          "variacion", "variacion_pp",
                          "moneda", "moneda_m", "moneda_b", "texto"];

function verificar() {
  const marco = [], catalogo = [], avisos = [];
  const css = getComputedStyle(document.documentElement);
  const pt = n => n * 96 / 72;

  /* -- marco: geometría ---------------------------------------------------- */
  const pagina = document.querySelector(".pagina");
  const ancho = pagina.getBoundingClientRect().width;
  marco.push([Math.abs(ancho - pt(864)) < 2,
    `Ancho de página 864 pt (medido ${Math.round(ancho)} px)`]);

  const reja = document.querySelector(".reja");
  if (reja) {
    const cols = getComputedStyle(reja).gridTemplateColumns.split(" ");
    const comentarios = parseFloat(cols[cols.length - 1]);
    marco.push([Math.abs(comentarios - pt(208)) < 2,
      `Columna de comentarios 208 pt (medida ${Math.round(comentarios)} px)`]);
  } else {
    marco.push([false, "No hay ningún indicador: falta la columna de comentarios"]);
  }

  /* -- marco: tipografía ---------------------------------------------------
     Enlazadas en vez de incrustadas, quien imprima sin conexión saca su página
     en Helvetica y el consolidado queda desparejo. document.fonts las ve solo
     si están declaradas; el @font-face con base64 es lo que las garantiza. */
  const familias = [...document.fonts].map(f => f.family.replace(/['"]/g, ""));
  marco.push([familias.includes("Inter"), "Inter declarada en el documento"]);
  marco.push([familias.includes("Montserrat"), "Montserrat declarada en el documento"]);
  marco.push([!document.querySelector('link[href*="fonts.googleapis"], link[href*="fonts.gstatic"]'),
    "Las tipografías van incrustadas, no enlazadas"]);

  /* -- marco: logo oficial -------------------------------------------------- */
  const svg = document.querySelector(".tapa .marca svg");
  const rellenos = svg ? [...svg.querySelectorAll("path")]
    .map(p => (p.getAttribute("fill") || "").toUpperCase()) : [];
  marco.push([!!svg && rellenos.includes("#7E22CE") && rellenos.includes("#F45201"),
    "Logo oficial en la tapa (tile morado y spark naranja)"]);

  /* -- marco: la tapa ------------------------------------------------------- */
  marco.push([!!REPORTE.area, "El área tiene nombre en la tapa"]);
  marco.push([/^\d{4}-\d{2}-\d{2}$/.test(REPORTE.corte || ""),
    "Fecha de corte con formato AAAA-MM-DD"]);

  const inds = (REPORTE.secciones || []).flatMap(s => s.indicadores || []);
  marco.push([inds.length > 0, `Hay indicadores (${inds.length})`]);

  /* -- marco: orden de los KPIs --------------------------------------------
     No es capricho: el lector recorre las páginas buscando el mismo KPI en el
     mismo sitio. Se permite omitir los que no apliquen, nunca reordenar. */
  const desordenados = inds.filter(i => {
    const pos = (i.kpis || []).map(posicionKpi).filter(x => x >= 0);
    return pos.some((v, n) => n > 0 && v < pos[n - 1]);
  }).map(i => i.nombre);
  marco.push([!desordenados.length,
    desordenados.length ? `KPIs fuera del orden estándar: ${desordenados.join(", ")}`
                        : "KPIs en el orden estándar"]);

  /* -- marco: formatos de número -------------------------------------------- */
  const formatos = new Set();
  for (const i of inds) {
    for (const k of (i.kpis || [])) if (k.formato) formatos.add(k.formato);
    for (const g of [i.semanal, i.mensual]) {
      if (g?.formato) formatos.add(g.formato);
      for (const s of (g?.series || [])) if (s.formato) formatos.add(s.formato);
    }
  }
  const fmtRaros = [...formatos].filter(f => !FORMATOS_VALIDOS.includes(f));
  marco.push([!fmtRaros.length,
    fmtRaros.length ? `Formatos desconocidos (salen como entero): ${fmtRaros.join(", ")}`
                    : "Todos los formatos de número son del catálogo"]);

  /* -- catálogo: colores ----------------------------------------------------
     La regla ya no es «empieza por --serie». Es: nada literal, y lo propio del
     área declarado con prefijo --area-, para que la excepción se vea. */
  const colores = new Set();
  for (const i of inds) for (const g of [i.semanal, i.mensual])
    for (const s of (g?.series || [])) if (s.color) colores.add(s.color);

  const DEL_CATALOGO = /^var\(--(serie-\d|serie-linea|serie-negra|cat-\d{1,2}|sec-[1-6]|estado-[a-z]+|morado|barra|meta)\)$/;
  const DEL_AREA = /^var\(--area-[a-z0-9-]+\)$/;

  const literales = [...colores].filter(c => !c.startsWith("var("));
  const propios   = [...colores].filter(c => DEL_AREA.test(c));
  const raros     = [...colores].filter(c =>
    c.startsWith("var(") && !DEL_CATALOGO.test(c) && !DEL_AREA.test(c));

  catalogo.push([!literales.length,
    literales.length ? `Colores literales (declara un token --area-): ${literales.join(", ")}`
                     : "Ningún color literal"]);
  catalogo.push([!raros.length,
    raros.length ? `Tokens que no son del catálogo ni llevan prefijo --area-: ${raros.join(", ")}`
                 : "Todos los tokens son del catálogo"]);

  /* Redefinir un token del marco desde el área rompe el consolidado en silencio. */
  const pisados = ["--serie-1", "--serie-2", "--serie-3", "--tinta", "--franja", "--morado"]
    .filter(t => {
      const hoja = { "--serie-1": "#A855F7", "--serie-2": "#2DD4BF", "--serie-3": "#FB7185",
                     "--tinta": "#171717", "--franja": "#F5F5F5", "--morado": "#7E22CE" }[t];
      return css.getPropertyValue(t).trim().toUpperCase() !== hoja;
    });
  marco.push([!pisados.length,
    pisados.length ? `Tokens del catálogo redefinidos por el área: ${pisados.join(", ")}`
                   : "Ningún token del catálogo fue redefinido"]);

  /* -- avisos: no rompen nada, pero se ven en la reunión -------------------- */
  const sinComentario = inds.filter(i => !i.comentario).map(i => i.nombre);
  const sinKpis = inds.filter(i => !i.kpis?.length).map(i => i.nombre);
  const sinSello = inds.filter(i => !i.sello?.estado).map(i => i.nombre);
  if (sinKpis.length) avisos.push(["mal", `Sin KPIs: ${sinKpis.join(", ")}`]);
  if (sinComentario.length) avisos.push(["ojo", `Sin comentario (queda el recuadro vacío): ${sinComentario.join(", ")}`]);
  if (sinSello.length) avisos.push(["ojo", `Sin sello: ${sinSello.join(", ")}`]);
  if (propios.length) avisos.push(["ojo", `Tokens propios del área declarados: ${propios.join(", ")}`]);

  const linea = ([ok, t]) => `<li class="${ok ? "bien" : "mal"}">${ok ? "✓" : "✗"} ${t}</li>`;
  const fallas = [...marco, ...catalogo].filter(([ok]) => !ok).length;

  document.getElementById("revision").innerHTML = `
    <h4>Verificación${fallas ? ` — ${fallas} ${fallas === 1 ? "falla" : "fallas"}` : " — todo en verde"}</h4>
    <ul>
      <li class="titulo-grupo">Marco · lo que comparten todas las áreas</li>
      ${marco.map(linea).join("")}
      <li class="titulo-grupo">Catálogo · de dónde salen los colores</li>
      ${catalogo.map(linea).join("")}
      ${avisos.length ? `<li class="titulo-grupo">Avisos · no rompen la consolidación</li>
      ${avisos.map(([c, t]) => `<li class="${c}">· ${t}</li>`).join("")}` : ""}
    </ul>`;
}

/* ---------------------------------------------------------------- controles */
document.getElementById("pestanas").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || b.dataset.vista === estadoVista) return;
  estadoVista = b.dataset.vista;
  render();
});

let tarjetaHit = null;
function pintarTarjeta(hit, ev) {
  const card = document.getElementById("tarjeta-mes");
  if (!card || !hit?.dataset.punto) return;
  if (tarjetaHit !== hit) {
    tarjetaHit = hit;
    let punto;
    try { punto = JSON.parse(hit.dataset.punto); }
    catch { return; }
    const barras = punto.series.filter(s => s.tipo !== "linea" && s.valor);
    const total = barras.reduce((s, x) => s + x.valor, 0);
    const filas = punto.series.filter(s => s.valor != null).map(s => {
      const parte = total && s.tipo !== "linea" ? `<em>${fmt(s.valor / total * 100, "porcentaje")}</em>` : "";
      return `<li><i class="${s.tipo === "linea" ? "linea" : ""}" style="background:${s.color}"></i><span>${escapeFiltro(s.nombre)}</span><b>${fmt(s.valor, s.formato || "entero")}</b>${parte}</li>`;
    }).join("");
    const volumen = barras.length
      ? `<p class="tarjeta-mes-vol"><span>Volumen</span><b>${fmt(total, "entero")}</b></p>`
      : "";
    card.innerHTML = `
      <p class="tarjeta-mes-cuando">${escapeFiltro(punto.mes)}</p>
      <p class="tarjeta-mes-corte">${escapeFiltro(detalleFiltro() || resumenFiltro())}</p>
      <ul>${filas}</ul>
      ${volumen}`;
  }
  card.hidden = false;
  const margen = 12;
  const ancho = card.offsetWidth;
  const alto = card.offsetHeight;
  const x = Math.min(ev.clientX + 14, window.innerWidth - ancho - margen);
  const y = Math.min(ev.clientY + 16, window.innerHeight - alto - margen);
  card.style.left = Math.max(margen, x) + "px";
  card.style.top = Math.max(margen, y) + "px";
}
function ocultarTarjeta() {
  tarjetaHit = null;
  const card = document.getElementById("tarjeta-mes");
  if (card) card.hidden = true;
}
const paginaEl = document.getElementById("pagina");
paginaEl.addEventListener("mouseover", e => {
  const hit = e.target.closest(".mes-hit");
  if (hit) pintarTarjeta(hit, e);
});
paginaEl.addEventListener("mousemove", e => {
  const hit = e.target.closest(".mes-hit");
  if (hit) pintarTarjeta(hit, e);
});
paginaEl.addEventListener("mouseout", e => {
  const hit = e.target.closest(".mes-hit");
  if (!hit) return;
  const sig = e.relatedTarget && e.relatedTarget.closest?.(".mes-hit");
  if (sig) return;
  ocultarTarjeta();
});
paginaEl.addEventListener("click", e => {
  const hit = e.target.closest(".mes-hit");
  if (hit && hit.dataset.iso) elegirPeriodo(hit.dataset.iso);
});
paginaEl.addEventListener("focusin", e => {
  const hit = e.target.closest(".mes-hit");
  if (hit) pintarTarjeta(hit, { clientX: hit.getBoundingClientRect().left, clientY: hit.getBoundingClientRect().bottom });
});
paginaEl.addEventListener("focusout", e => {
  if (e.target.closest(".mes-hit")) ocultarTarjeta();
});

if (enAppsScript()) {
  abrirTablero();
} else {
  iniciarFiltros();
  render();
}
</script>
